services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: indexer
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://indexer:indexer@postgres:5432/indexer
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
  worker:
    build: ./workers
    environment:
      DATABASE_URL: postgresql+psycopg://indexer:indexer@postgres:5432/indexer
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
  frontend:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:5173"]
volumes:
  postgres_data:
